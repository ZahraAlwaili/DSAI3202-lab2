trigger:
  branches:
    include:
      - main  # This ensures the pipeline runs every time you push to main

pool:
  vmImage: ubuntu-latest

variables:
  # FIX: Replace 'X' with your subscription suffix (e.g., 1)
  AZURE_SUBSCRIPTION: 'SC-UDST-CCIT-DSAI3202-1' 
  RESOURCE_GROUP: 'rg-60307052'
  WORKSPACE_NAME: 'Amazon-Electronics-Lab-60307052'

steps:
- checkout: self

- task: AzureCLI@2
  displayName: "Submit Azure ML Training Job"
  inputs:
    azureSubscription: $(AZURE_SUBSCRIPTION)
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -e 

      echo "Ensuring Azure ML CLI extension is installed"
      az extension add -n ml -y || az extension update -n ml 

      echo "Setting Azure ML defaults"
      az configure --defaults \
        group=$(RESOURCE_GROUP) \
        workspace=$(WORKSPACE_NAME) 

      echo "Submitting Azure ML job"
      # This captures the job name so we can stream logs to the DevOps console
      JOB_NAME=$(az ml job create --file jobs/train_job.yml --query name -o tsv) 

      echo "Job name: $JOB_NAME" 

      echo "Streaming job logs"
      az ml job stream --name $JOB_NAME
    