$schema: https://azuremlschemas.azureedge.net/latest/sweepJob.schema.json
type: sweep
display_name: Amazon_Review_Sweep_Final  
experiment_name: DSAI3202-lab2
trial:
  code: ../src
  command: >-
    python train.py 
    --train_data ${{inputs.train_data}} 
    --val_data ${{inputs.val_data}} 
    --test_data ${{inputs.test_data}} 
    --output ${{outputs.output}}
    --C ${{search_space.C}}
    --solver ${{search_space.solver}}
  environment: azureml:AzureML-sklearn-1.0-ubuntu20.04-py38-cpu@latest

inputs:
  train_data: 
    path: azureml:amazon_review_merged_features_train:5
    mode: download
  val_data: 
    path: azureml:amazon_review_merged_features_val:5
    mode: download
  test_data: 
    path: azureml:amazon_review_merged_features_test:5
    mode: download

search_space:
  C:
    type: choice
    values: [0.01, 0.1, 1.0, 10.0]
  solver:
    type: choice
    values: ['liblinear', 'saga']

outputs:
  output:
    mode: upload

compute: azureml:feature-engineering-compute
sampling_algorithm: random
objective:
  goal: maximize
  primary_metric: val_accuracy
limits:
  max_total_trials: 10
  max_concurrent_trials: 2