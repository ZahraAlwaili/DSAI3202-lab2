$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: tfidf_features
display_name: TF-IDF Features
version: 3
type: command
inputs:
  data:
    type: uri_folder
outputs:
  out:
    type: uri_folder
  model_out:
    type: uri_folder
code: .
command: >
  python tfidf_features.py 
  --data ${{inputs.data}} 
  --out ${{outputs.out}} 
  --model_out ${{outputs.model_out}}
environment: azureml:AzureML-sklearn-1.1-ubuntu20.04-py38-cpu@latest